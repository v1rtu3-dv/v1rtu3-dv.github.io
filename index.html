<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1rtu3.dev - Coming Soon</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', 'Roboto Mono', monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated grid background */
        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(60px, 60px);
            }
        }

        /* Glowing orb effect */
        .orb {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
            filter: blur(60px);
            animation: float 8s ease-in-out infinite, pulse-orb 4s ease-in-out infinite;
            pointer-events: none;
        }

        .orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            animation-delay: 2s;
            animation-duration: 10s;
        }

        .orb:nth-child(3) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, transparent 70%);
            animation-delay: 4s;
            animation-duration: 12s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(-50%, -50%);
            }
            33% {
                transform: translate(-30%, -60%);
            }
            66% {
                transform: translate(-70%, -40%);
            }
        }

        @keyframes pulse-orb {
            0%, 100% {
                opacity: 0.5;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.1);
            }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }

        .logo {
            font-size: 5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            letter-spacing: -2px;
            animation: fadeIn 0.8s ease-out;
            position: relative;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            margin-bottom: 3rem;
            animation: fadeIn 0.8s ease-out 0.2s backwards;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #6366f1;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        .status-text {
            font-size: 0.9rem;
            color: #6366f1;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tagline {
            font-size: 1.5rem;
            color: #888;
            margin-bottom: 4rem;
            font-weight: 400;
            animation: fadeIn 0.8s ease-out 0.4s backwards;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            animation: fadeIn 0.8s ease-out 0.6s backwards;
        }

        .link {
            color: #666;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 0.75rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .link:hover {
            color: #6366f1;
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(99, 102, 241, 0.05);
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Terminal cursor effect */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: #6366f1;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }
            51%, 100% {
                opacity: 0;
            }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #6366f1;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 15s linear infinite;
            opacity: 0;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(0) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) scale(1.5);
                opacity: 0;
            }
        }

        /* Scan line effect */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(99, 102, 241, 0.05) 50%,
                transparent 100%
            );
            animation: scan 8s linear infinite;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes scan {
            0% {
                transform: translateY(-100%);
            }
            100% {
                transform: translateY(100%);
            }
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 3rem;
            }

            .tagline {
                font-size: 1.2rem;
            }

            .links {
                flex-direction: column;
                gap: 1rem;
            }

            .link {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="grid"></div>
    <div class="scanline"></div>
    <div class="orb" style="top: 30%; left: 20%;"></div>
    <div class="orb" style="top: 60%; left: 70%;"></div>
    <div class="orb" style="top: 80%; left: 40%;"></div>

    <div class="container">
        <h1 class="logo">v1rtu3.dev<span class="cursor"></span></h1>
        
        <div class="status">
            <span class="status-dot"></span>
            <span class="status-text">Coming Soon</span>
        </div>

        <p class="tagline">Developer Portfolio</p>

        <div class="links">
            <a href="https://github.com/v1rtu3-dv" class="link" target="_blank" rel="noopener noreferrer">
                <span>→</span> GitHub
            </a>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particleCount = 40;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                
                // Random colors from gradient
                const colors = ['#6366f1', '#8b5cf6', '#ec4899'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                document.body.appendChild(particle);
            }
        }

        createParticles();
    </script>
</body>
</html>
